<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft assistant</title>
  <script>
    // The chosen theme is applied before the first paint, so a light page never flashes dark (see app.js)
    (function () {
      try {
        var chosen = localStorage.getItem('draft-assistant-theme');
        if (chosen === 'light' || chosen === 'dark') document.documentElement.dataset.theme = chosen;
      } catch (error) { /* storage blocked: follow the system */ }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="app" data-tab="plan">
    <header class="topbar">
      <nav class="modes" id="modes" aria-label="Which draft">
        <a id="mode-real" href="/" title="The real draft: you log every pick yourself">Real draft</a>
        <a id="mode-mock" href="/mock" title="A mock draft: the other 13 teams pick automatically, with its own saved file">Mock draft</a>
      </nav>
      <div class="saved" id="saved-state" role="status" title="Whether the draft is saved in the draft file"></div>
      <div class="clock">
        <p id="clock-line" class="clock-line">Loading</p>
        <p id="snake-note" class="note" hidden></p>
        <p id="predict-line" class="predict-line" role="status" hidden></p>
      </div>
      <div id="snake" class="snake" role="img" aria-label="Pick order for the current round"></div>
      <div class="topbar-actions">
        <button id="behind" type="button" aria-expanded="false" title="You missed some picks. Say which pick Yahoo is at and the picks in between are marked unseen.">I am behind</button>
        <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings"><span id="settings-summary">Settings</span></button>
        <button id="theme" type="button" title="Colours: follow the system, always light or always dark">Theme: Auto</button>
        <button id="reset" type="button" class="quiet" title="Clears every pick. The old draft file is kept as a copy. Press twice.">Reset draft</button>
      </div>
      <form id="behind-form" class="behind-form" hidden>
        <label>Yahoo is at pick <input id="behind-pick" type="number" min="2" step="1" inputmode="numeric"></label>
        <button type="submit">Add the missed picks</button>
        <span id="behind-note" class="note" role="status"></span>
      </form>
    </header>

    <div id="error" class="banner" role="alert" hidden>
      <span id="error-text"></span>
      <button id="error-retry" type="button" hidden>Retry</button>
      <button id="error-dismiss" type="button" hidden>Dismiss</button>
    </div>

    <section id="settings" class="settings" aria-label="Settings" hidden>
      <div id="setting-confirm" class="setting-confirm" role="alert" hidden>
        <span id="setting-confirm-text"></span>
        <button id="setting-apply" type="button" class="primary">Apply</button>
        <button id="setting-keep" type="button">Keep current</button>
      </div>
      <div class="settings-grid">
        <div>
          <h2>Scoring categories <button type="button" class="help" aria-label="About the categories" aria-expanded="false" data-help="Untick a category to leave it out of every score and plan.">?</button></h2>
          <div id="categories" class="categories"></div>
        </div>
        <div>
          <h2>Score</h2>
          <div class="choice-row">
            <div>
              <label class="choice method"><input type="radio" name="method" value="uncapped"> Reward big numbers</label>
              <label class="choice method"><input type="radio" name="method" value="capped"> Cap at the top 5%</label>
            </div>
            <button type="button" class="help" aria-label="About the scoring method" aria-expanded="false" data-help="Uncapped counts a 32-point scorer as better than a 26-point one. Capped treats everyone past the top 5% in a category as equal.">?</button>
          </div>
          <h3 class="subhead">Score column <button type="button" class="help" aria-label="About the Score column" aria-expanded="false" data-help="How the Score cell is drawn. The bar is full for the best score left and a short sliver for the lowest, so every player has a bar and two different scores always give two different bars. Hover a score for the exact gap. The number in brackets is the same score computed from 2025-26 per-game stats, with the same categories, method and games setting. The arrow says whether the projection is better (up) or worse (down) than that, from a gap of 5 points; a player with under 20 games last season has no arrow.">?</button></h3>
          <label class="choice"><input type="radio" name="scorestyle" value="bar" checked> Bar: from the lowest score left to the best</label>
          <label class="choice"><input type="radio" name="scorestyle" value="rank"> Colour by rank: top 5, 15, 30, 60</label>
          <label class="choice"><input type="radio" name="scorestyle" value="range"> Colour by range: 5th to 95th percentile</label>
          <div class="choice-row"><label class="choice games"><input id="needs" type="checkbox"> Favour the categories I can still win</label> <button type="button" class="help" aria-label="About favouring categories" aria-expanded="false" data-help="Off, every category counts equally. On, a category where you are close to the other teams counts a little more and one you already dominate or cannot catch a little less, after a few rounds. The weights in use are listed under Standing. Only ticked categories count.">?</button></div>
          <div class="choice-row"><label class="choice games"><input id="games-adjusted" type="checkbox"> Count games missed</label> <button type="button" class="help" aria-label="About counting games missed" aria-expanded="false" data-help="Scales each score by the share of a 70-game season the player is projected to play, so a player projected for 59 games counts as 84% and anyone projected for 70 or more counts in full.">?</button></div>
        </div>
        <div>
          <h2>Who will still be there? <button type="button" class="help" aria-label="About the spreads" aria-expanded="false" data-help="Spreads are starting guesses. Real drafts will tell us better values.">?</button></h2>
          <label class="choice"><input type="radio" name="rule" value="probability" checked> Odds from ADP</label>
          <label class="choice"><input type="radio" name="rule" value="window"> ADP window</label>
          <div id="rule-probability" class="fields">
            <label>Early-round spread <input id="rule-base-sd" type="number" min="0.1" max="20" step="0.1" value="2"></label>
            <label>Spread added per ADP place <input id="rule-sd-per-adp" type="number" min="0" max="1" step="0.05" value="0.2"></label>
            <label>Plan on a player when his odds are at least <input id="rule-threshold" type="number" min="0.05" max="0.95" step="0.05" value="0.5"></label>
          </div>
          <div id="rule-window" class="fields" hidden>
            <label>Plan on a player whose ADP is no more than this many picks earlier <input id="rule-slack" type="number" min="0" max="60" step="1" value="3"></label>
          </div>
        </div>
      </div>
    </section>

    <section class="panel seam-rec" data-panel="rec" aria-label="Recommendation">
      <div id="hero" class="hero" aria-live="polite"></div>
    </section>

    <section class="panel seam-plan" data-panel="plan">
      <h2>Plan for your remaining picks</h2>
      <p id="search-note" class="search-note" role="status" hidden></p>
      <div id="plan"></div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Panels">
      <button type="button" data-tab="table">Table</button>
      <button type="button" data-tab="plan">Plan</button>
      <button type="button" data-tab="team">My team</button>
      <button type="button" data-tab="standing">Standing</button>
      <button type="button" data-tab="teams">14 teams</button>
      <button type="button" data-tab="log">Log</button>
    </nav>

    <main class="panel tablecol" data-panel="table">
      <div class="table-head">
        <div class="filters">
          <input id="search" type="search" placeholder="Search by name or team" aria-label="Search players">
          <div id="positions" class="chips" role="group" aria-label="Filter by position"></div>
          <button id="outside" type="button" title="The pick on the clock was a player who is not in the list of 150. The pick is counted, no one leaves the pool.">Pick not in the list</button>
        </div>
        <div class="last-pick">
          <span id="last-pick" role="status">Nothing logged yet.</span>
          <button id="undo" type="button">Undo</button>
        </div>
        <p id="unseen-note" class="search-note" role="status" hidden></p>
        <p id="choosing-note" class="search-note" role="status" hidden></p>
      </div>
      <div class="table-wrap">
        <table id="pool">
          <thead id="pool-head"></thead>
          <tbody id="pool-body"></tbody>
        </table>
      </div>
      <p class="note table-note">Click a player to log the pick on the clock. <button type="button" class="help" aria-label="About logging picks" aria-expanded="false" data-help="Picks log in order, and the snake order decides which ones are yours.">?</button></p>
    </main>

    <div class="rail">
    <section class="panel team" data-panel="team">
      <div class="roster-head">
        <h2 id="roster-title">Your roster</h2>
        <button id="roster-back" type="button" class="roster-back" hidden>Back to your roster</button>
      </div>
      <div class="roster-tools">
        <select id="roster-team" aria-label="Show the roster of a team"></select>
        <div id="roster-basis" class="league-views" role="group" aria-label="Which players" hidden>
          <button type="button" data-basis="sofar">So far</button>
          <button type="button" data-basis="projected">Projected</button>
        </div>
      </div>
      <p id="roster-note" class="note" hidden></p>
      <ol id="roster" class="roster"></ol>
      <p id="roster-positions" class="note"></p>
    </section>

    <section class="panel seam-standing" data-panel="standing">
      <h2>Standing</h2>
      <div id="profile"></div>
    </section>

    <section class="panel log" data-panel="log">
      <h2>Draft log</h2>
      <p id="prediction-summary" class="note prediction-summary" role="status" hidden></p>
      <details id="managers" class="managers" hidden>
        <summary>By manager</summary>
        <div id="managers-table"></div>
      </details>
      <ol id="log" class="log"></ol>
    </section>
    </div>

    <section class="panel teams" data-panel="teams">
      <h2>14 teams</h2>
      <div id="league"></div>
    </section>
  </div>

  <div id="help-pop" class="help-pop" role="note" hidden></div>

  <script src="/logic.js"></script>
  <script src="/app.js"></script>
</body>
</html>
